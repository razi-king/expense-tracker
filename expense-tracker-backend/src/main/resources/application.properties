spring.application.name=ExpenseTracker
server.port=${PORT:8080}

# Database: MySQL locally by default. In the cloud, point these at Postgres (e.g. Neon):
#   DATABASE_URL=jdbc:postgresql://<host>/<db>?sslmode=require  DB_USERNAME=...  DB_PASSWORD=...
# The JDBC driver and Hibernate dialect are detected from the URL.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/expensetracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Base64 secret for signing JWTs. Generate one with: openssl rand -base64 48
secretKey=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4321}
