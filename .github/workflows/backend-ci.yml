name: Backend CI

on:
  push:
    branches: [main]
    paths: ["expense-tracker-backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["expense-tracker-backend/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expensetracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expense"
          --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: expense-tracker-backend
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/expensetracker
      DB_USERNAME: expense
      DB_PASSWORD: expense
      JWT_SECRET: Y2ktb25seS1zZWNyZXQtbm90LXVzZWQtYW55d2hlcmUtZWxzZS0xMjM0NTY3ODkw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test (against Postgres)
        run: mvn -B package
      - name: Build Docker image
        run: docker build -t expense-tracker-api .
