# Render Blueprint for the Expense Tracker API.
# Render dashboard → New → Blueprint → pick this repo, then fill in the secrets.
services:
  - type: web
    name: razi-expense-api
    runtime: docker
    plan: free
    rootDir: expense-tracker-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://razi-king.github.io
      - key: DATABASE_URL     # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET       # openssl rand -base64 48
        generateValue: true
